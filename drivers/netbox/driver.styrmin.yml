---
apiVersion: "styrmin.io/v1"
kind: ApplicationDriver
metadata:
  name: netbox
spec:
  version: "1"
  supported_versions: ">=4.7,<4.8"
  default_version: "4.7.5"
  info:
    icon: https://raw.githubusercontent.com/netbox-community/netbox/main/docs/netbox_logo_light.svg
    description: IP address management (IPAM) and data center infrastructure management (DCIM) tool
    authors: []
    license: Apache-2.0
    links:
      - link: Homepage
        url: 'https://netbox.dev/'
      - link: Documentation
        url: 'https://netboxlabs.com/docs/netbox/'
      - link: Github
        url: 'https://github.com/netbox-community/netbox'
  helm:
    main:
      location: oci://ghcr.io/netbox-community/netbox-chart/netbox
      version: 8.3.105

  parameters:
    - name: database_storage_size
      label: "Database storage size (Gi)"
      kind: integer
      default: 8
    - name: media_storage_size
      label: "Media storage size (Gi)"
      kind: integer
      default: 1
    - name: enable_housekeeping
      label: "Run the daily housekeeping job"
      kind: boolean
      default: false

  components:
    server:
      container: netbox
      identifier:
        label:
          app.kubernetes.io/component: netbox
      backup:
        enabled: true
        kind: disk
        # Pod-template volume name of the media PVC (uploaded images and
        # attachments), mounted at /opt/netbox/netbox/media.
        volume: media

    worker:
      container: netbox-worker
      identifier:
        label:
          app.kubernetes.io/component: worker

    database:
      container: postgresql
      singleton: true
      identifier:
        label:
          app.kubernetes.io/name: postgresql
      backup:
        enabled: true
        kind: postgres
        database_name: netbox

    cache:
      container: valkey
      singleton: true
      identifier:
        label:
          app.kubernetes.io/name: valkey

  services:
    - name: netbox
      kind: http
      scope: internal
      port: 8080
      component: server

  actions:
    - name: upgrade
      hook: upgrade
      mode: core
      description: Upgrade NetBox
      location: "actions.py::upgrade"

