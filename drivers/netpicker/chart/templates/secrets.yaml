apiVersion: v1
kind: Secret
metadata:
  name: default
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.db.postgresPassword | default (randAscii 64) | b64enc | quote }}
  JWT_SECRET: {{ .Values.api.jwtSecret | default (randAscii 64) | b64enc | quote }}

  API_DB_USER: {{ .Values.db.apiUser | default "netpicker" | b64enc | quote }}
  API_DB_PASSWORD: {{ .Values.db.apiPassword | default "netpicker" | b64enc | quote }}
  API_DB_ADMIN_USER: {{ .Values.db.apiUser | default "netpicker" | b64enc | quote }}
  API_DB_ADMIN_PASSWORD: {{ .Values.db.apiPassword | default "netpicker" | b64enc | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.rootPassword | default "minio-S3cret-key.!" | b64enc | quote }}

  {{- if .Values.redis.password }}
  REDIS_PASSWORD: {{ .Values.redis.passwordValue | default "n3tp!ck3R." | b64enc | quote }}
  {{- end }}
