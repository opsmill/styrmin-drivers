{{ if and .Values.mariadb.enabled .Values.mariadb.storage.enabled}}
{{ if .Values.mariadb.storage.pv.enabled}}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: slurpit-mariadb-pv
  labels:
    {{- include "slurpit.componentLabels" (dict "root" . "component" "mariadb") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: {{ .Values.mariadb.storage.pv.size }}
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: slurpit-mariadb-pvc
    namespace: slurpit
{{- with .Values.mariadb.storage.pv.extraSpec }}
  {{- toYaml . | nindent 2 }}
{{- end }}
  persistentVolumeReclaimPolicy: {{ .Values.mariadb.storage.pv.reclaimPolicy }}
  storageClassName: {{ .Values.mariadb.storage.className }}
  volumeMode: Filesystem
{{ end }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "slurpit.fullname" . }}-mariadb-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slurpit.componentLabels" (dict "root" . "component" "mariadb") | nindent 4 }}
{{- with .Values.mariadb.storage.extraMetadata }}
  {{- toYaml . | nindent 2 }}
{{- end }}
spec:
  accessModes:
  - {{ .Values.mariadb.storage.accessModes }}
  resources:
    requests:
      storage: {{ .Values.mariadb.storage.size }}
  storageClassName: {{ .Values.mariadb.storage.className }}
{{ end }}

