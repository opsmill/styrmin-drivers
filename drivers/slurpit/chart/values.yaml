    PORTAL_BIND_DNS: false
    PORTAL_BASE_URL: http://localhost
    PORTAL_BASE_PATH: 
    PORTAL_BASE_SCHEME: 
    PORTAL_TRUST_FORWARDED_HEADERS: false
    PORTAL_MENU_MODE: classic
    PORTAL_AIR_GAPPED: false

    PORTAL_ADMIN_ENABLED: false
    PORTAL_ADMIN_PASSWORD: 12345678
    
    PORTAL_LDAP_DEBUG: false
    PORTAL_LDAP_MODE: try

    PORTAL_WAREHOUSE_URL: http://slurpit-warehouse-service
    PORTAL_WAREHOUSE_TOKEN: pIcOFhKMTCzDiWH6kj7sD5PoVSbD3TGT
    PORTAL_WAREHOUSE_CALLBACK_TOKEN: b9X7vL2mQpA5zT1YwKdR6NsJ8oCfG3Hc

    PORTAL_NETPICKER_URL: https://netpicker.io
    PORTAL_PLUGIN_BATCH_SIZE: 10000

    PORTAL_DB_NAME: portal
    PORTAL_DB_HOSTNAME: slurpit-mariadb-service
    PORTAL_DB_PORT: 3306
    PORTAL_DB_USERNAME: slurpit
    PORTAL_DB_PASSWORD: qDlqHrK1VBoq!ac
    PORTAL_DB_SSL: false
