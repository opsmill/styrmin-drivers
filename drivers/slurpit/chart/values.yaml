scanner:
  enabled: true
  timezone: # Defaults to the global.timezone
  restartPolicy: Always
  image:
    name: slurpit/scanner
    version: # Defaults to the global.image.version
    registry: # Defaults to the global.image.registry
    pullPolicy: # Defaults to the global.image.pullPolicy
  env:    
    SCANNER_DEBUG: false
    SCANNER_DEBUG_SCAPY: false
    SCANNER_POOLSIZE: 16
    SCANNER_IDENTIFIER: scanner
    SCANNER_TAGS: "default"

    SCANNER_WAREHOUSE_HOSTNAME: slurpit-warehouse-service
    SCANNER_WAREHOUSE_TOKEN: "pIcOFhKMTCzDiWH6kj7sD5PoVSbD3TGT"
    SCANNER_WAREHOUSE_PORT: 50051

    SCANNER_RATELIMITER: 0
    SCANNER_RATELIMITER_SCAN: false
    SCANNER_DNS_LOOKUP_ENABLED: true
    SCANNER_SMART_IP_DISCOVERY: false 

    SCANNER_SNMP_TIMEOUT: 6
    SCANNER_SNMP_RETRIES: 2

    SCANNER_ARP_ENABLED: true
    SCANNER_ARP_TIMEOUT: 10
    SCANNER_ARP_TCP_ENABLED: false

    SCANNER_ICMP_ENABLED: false
    SCANNER_ICMP_ALT_ENABLED: true
    SCANNER_ICMP_TIMEOUT: 6

    SCANNER_TCP_ENABLED: false
    SCANNER_TCP_TIMEOUT: 6
    SCANNER_TCP_PORTS: "22, 23"

    SCANNER_UDP_ENABLED: false
    SCANNER_UDP_TIMEOUT: 6

    SCANNER_POLL_ENABLED: true
    SCANNER_POLL_TESTS_ENABLED: true
  security:
    container:
      allowPrivilegeEscalation: false
    template:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
  extraPodSpecs: # For your nodeSelectors, tolerations, affinity 

