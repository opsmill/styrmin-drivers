global:
  timezone: Europe/Amsterdam
  image:
    registry:  # If empty it uses docker, alternative is quay.io/
    version: latest
    pullPolicy: Always

mariadb:
  enabled: true  
  timezone: # Defaults to the global.timezone
  image:
    name: mariadb
    version: 12-noble
    registry: 
    pullPolicy: # Defaults to the global.image.pullPolicy
  storage:
    enabled: true
    accessModes: ReadWriteMany
    className: 
    size: 8Gi
    extraMetadata: # For your annotations and finalizers
    pv:
      enabled: false # the pvc usually manages the pv, enable if you want to manage it in the helm
      reclaimPolicy: Retain
      size: 32Gi
      extraSpec:
  service:
    type: ClusterIP
    mysql: 
      port: 3306
      nodePort: 
  env:
    MARIADB_DATABASE: portal
    MARIADB_USER: slurpit
    MARIADB_PASSWORD: qDlqHrK1VBoq!ac
    MARIADB_RANDOM_ROOT_PASSWORD: true
    MARIADB_AUTO_UPGRADE: true
  security:
    container:
      allowPrivilegeEscalation: false
    template:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
  extraPodSpecs: # For your nodeSelectors, tolerations, affinity 

mongodb:
  enabled: true 
  timezone: # Defaults to the global.timezone
  image:
    name: mongo
    version: 8
    registry: 
    pullPolicy: # Defaults to the global.image.pullPolicy
  storage:
    enabled: true
    accessModes: ReadWriteMany
    className: 
    size: 16Gi
    extraMetadata: # For your annotations and finalizers
    pv:
      enabled: false # the pvc usually manages the pv, enable if you want to manage it in the helm
      reclaimPolicy: Retain
      size: 128Gi
      extraSpec:
  service:
    type: ClusterIP
    mongo: 
      port: 27017
      nodePort: 
  env:
    MONGO_INITDB_ROOT_USERNAME: slurpit
    MONGO_INITDB_ROOT_PASSWORD: IS8USd6KXEoK7z4ly9wUygRCzBVJCCiP 
  security:
    container:
      allowPrivilegeEscalation: false
    template:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
  extraPodSpecs: # For your nodeSelectors, tolerations, affinity 

portal:
  enabled: true  
  timezone: # Defaults to the global.timezone
  restartPolicy: Always
  image:
    name: slurpit/portal
    version: # Defaults to the global.image.version
    registry: # Defaults to the global.image.registry
    pullPolicy: # Defaults to the global.image.pullPolicy
  storage:
    enabled: true
    accessModes: ReadWriteMany
    className: 
    size: 8Gi
    extraMetadata: # For your annotations and finalizers
    pv:
      enabled: false # the pvc usually manages the pv, enable if you want to manage it in the helm
      reclaimPolicy: Retain
      size: 32Gi
      extraSpec:
  service:
    type: ClusterIP
    http: 
      enabled: true
      port: 80
      nodePort: 
    https: 
      enabled: false
      port: 443
      nodePort: 
    ldap: 
      enabled: false
      port: 636
      nodePort: 
