{#- Slurp'it versions each component separately (portal 1.4.235, scraper 1.4.76, ...). Each image
    has a tag for its release line, and the name of that tag differs between components. #}
{%- set line_tags = {
  "1.3": {"portal": "1.3.x", "warehouse": "1.3.x", "scanner": "1.3.x", "scraper": "1.3", "retriever": "1.3.x"},
  "1.4": {"portal": "1.4", "warehouse": "1.4", "scanner": "1.4", "scraper": "1.4", "retriever": "1.4"},
} %}
{%- set line = app.version.split(".")[:2] | join(".") %}
{%- set tags = line_tags[line] %}
{%- set url_scheme = instance.config.external_url_scheme | default("http", true) %}
{#- This deployment's own short host, built as Styrmin's compute_human_readable_fqdn builds it:
    <resolved service name>-<environment>, sanitized, cut to fit 63 characters. `services` holds
    every service of the environment by driver service name, so two Slurp'it deployments in one
    environment would read each other's entry: `deployed_services` names the owner. #}
{%- set own = namespace(name="") %}
{%- for s in deployed_services if s.deployment_id == (instance.deployment_id | string) and s.component == "portal" %}
{%- set own.name = s.resolved_name %}
{%- endfor %}
{%- set env_label = environment.name | to_fqdn_label %}
{%- set room = 62 - (env_label | length) %}
{%- set host_label = ((own.name | to_fqdn_label)[:room] | trim("-")) if room > 0 else "" %}
{%- set readable_fqdn = (host_label ~ "-" ~ env_label ~ "." ~ instance.config.fqdn_suffix) if host_label and instance.config.fqdn_suffix else "" %}
fullnameOverride: styrmin-slurpit

global:
  timezone: "{{ parameters.timezone }}"
  image:
    # A release-line tag moves to each new patch release: a pod that starts pulls the newest.
    pullPolicy: Always

# Each <component>.env is a map: the chart merges it over its own defaults
# and loads it through a ConfigMap (a list would replace the defaults).

# --- MariaDB ---
mariadb:
  enabled: true
  image:
    name: mariadb
    version: "12-noble"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  storage:
    enabled: true
    accessModes: ReadWriteOnce
    size: "{{ parameters.mariadb_storage_size }}Gi"
    className: "{{ instance.config.standard_storage.storage_class }}"
  env:
    MARIADB_DATABASE: portal
    MARIADB_USER: slurpit
    MARIADB_PASSWORD: slurpit-styrmin-password
    MARIADB_ROOT_PASSWORD: slurpit-styrmin-root-password
  extraVolumes:
    - name: backup
      emptyDir: {}
  extraVolumeMounts:
    - name: backup
      mountPath: /backup

# --- MongoDB ---
mongodb:
  enabled: true
  image:
    name: mongo
    version: "8"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  storage:
    enabled: true
    accessModes: ReadWriteOnce
    size: "{{ parameters.mongodb_storage_size }}Gi"
    className: "{{ instance.config.standard_storage.storage_class }}"
  env:
    MONGO_INITDB_ROOT_USERNAME: slurpit
    MONGO_INITDB_ROOT_PASSWORD: slurpit-styrmin-mongo-password
  extraVolumes:
    - name: backup
      emptyDir: {}
  extraVolumeMounts:
    - name: backup
      mountPath: /backup

# --- Portal ---
portal:
  enabled: true
  image:
    name: slurpit/portal
    version: "{{ tags.portal }}"
  service:
    type: ClusterIP
  storage:
    enabled: true
    accessModes: ReadWriteOnce
    size: "{{ parameters.portal_storage_size }}Gi"
    className: "{{ instance.config.standard_storage.storage_class }}"
  ingress:
    enabled: true
    host: "{{ services['slurpit'].primary_fqdn }}"
    # The short host that Styrmin shows (<service name>-<environment>).
    extraHosts:
{%- if readable_fqdn %}
      - "{{ readable_fqdn }}"
{%- else %} []
{%- endif %}
    path: /
    port: 80
  env:
    PORTAL_DB_HOSTNAME: styrmin-slurpit-mariadb-service
    PORTAL_DB_PORT: "3306"
    PORTAL_DB_NAME: portal
    PORTAL_DB_USERNAME: slurpit
    PORTAL_DB_PASSWORD: slurpit-styrmin-password
    PORTAL_WAREHOUSE_URL: "http://styrmin-slurpit-warehouse-service"
    PORTAL_WAREHOUSE_TOKEN: styrmin-slurpit-pw-token
    PORTAL_WAREHOUSE_CALLBACK_TOKEN: styrmin-slurpit-pwcb-token
    PORTAL_SAFEKEY: styrmin-slurpit-safekey
    PORTAL_BASE_URL: "{{ url_scheme }}://{{ services['slurpit'].primary_fqdn }}"

# --- Warehouse ---
warehouse:
  enabled: true
  image:
    name: slurpit/warehouse
    version: "{{ tags.warehouse }}"
  service:
    type: ClusterIP
  storage:
    enabled: true
    accessModes: ReadWriteOnce
    size: "{{ parameters.warehouse_storage_size }}Gi"
    className: "{{ instance.config.standard_storage.storage_class }}"
  env:
    WAREHOUSE_MONGODB_URI: "mongodb://slurpit:slurpit-styrmin-mongo-password@styrmin-slurpit-mongodb-service:27017/slurpit?authSource=admin"
    WAREHOUSE_PORTAL_URL: "http://styrmin-slurpit-portal-service"
    WAREHOUSE_PORTAL_TOKEN: styrmin-slurpit-pwcb-token
    WAREHOUSE_API_TOKEN: styrmin-slurpit-pw-token

# --- Scanner ---
scanner:
  enabled: true
  image:
    name: slurpit/scanner
    version: "{{ tags.scanner }}"
  env:
    SCANNER_WAREHOUSE_HOSTNAME: styrmin-slurpit-warehouse-service
    SCANNER_WAREHOUSE_PORT: "50051"
    SCANNER_WAREHOUSE_TOKEN: styrmin-slurpit-pw-token
    SCANNER_POOLSIZE: "{{ parameters.scanner_pool_size }}"

# --- Scraper ---
scraper:
  enabled: true
  image:
    name: slurpit/scraper
    version: "{{ tags.scraper }}"
  env:
    SCRAPER_WAREHOUSE_HOSTNAME: styrmin-slurpit-warehouse-service
    SCRAPER_WAREHOUSE_PORT: "50051"
    SCRAPER_WAREHOUSE_TOKEN: styrmin-slurpit-pw-token
    SCRAPER_POOLSIZE: "{{ parameters.scraper_pool_size }}"

# --- Retriever ---
retriever:
  enabled: true
  image:
    name: slurpit/retriever
    version: "{{ tags.retriever }}"
  env:
    RETRIEVER_WAREHOUSE_HOSTNAME: styrmin-slurpit-warehouse-service
    RETRIEVER_WAREHOUSE_PORT: "50051"
    RETRIEVER_WAREHOUSE_TOKEN: styrmin-slurpit-pw-token
    RETRIEVER_POOLSIZE: "{{ parameters.retriever_pool_size }}"
